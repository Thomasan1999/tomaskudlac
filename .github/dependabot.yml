version: 2
updates:
    # One npm entry covers the whole workspace tree - Dependabot reads the root lockfile, which now includes client.
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
      versioning-strategy: 'increase-if-necessary'
      groups:
          # Majors stay ungrouped so they still get looked at one at a time.
          development:
              dependency-type: 'development'
              update-types:
                  - 'minor'
                  - 'patch'
          production:
              dependency-type: 'production'
              update-types:
                  - 'minor'
                  - 'patch'
      commit-message:
          prefix: 'chore(deps)'
      open-pull-requests-limit: 5

    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
      groups:
          actions:
              patterns:
                  - '*'
      commit-message:
          prefix: 'chore(ci)'
      open-pull-requests-limit: 3
