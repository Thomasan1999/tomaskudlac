name: CI

on:
    pull_request:
        branches:
            - 'master'

permissions:
    contents: read

concurrency:
    group: '${{ github.workflow }}-${{ github.ref }}'
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - uses: ./.github/actions/setup-node-project

            - name: Build project
              run: npm run build

    format-check:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - uses: ./.github/actions/setup-node-project

            - name: Check code format
              run: npm run format:check

    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - uses: ./.github/actions/setup-node-project

            - name: Run linter
              run: npm run lint

    type-check:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - uses: ./.github/actions/setup-node-project

            - name: Check types
              run: npm run type-check

    test:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - uses: ./.github/actions/setup-node-project

            - name: Run unit tests
              run: npm run test:coverage

    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - uses: ./.github/actions/setup-node-project

            - name: Run end-to-end tests
              run: npm run test:e2e
