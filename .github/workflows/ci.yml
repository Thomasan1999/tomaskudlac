name: CI

on:
    pull_request:
        branches:
            - 'master'

permissions:
    contents: read

concurrency:
    group: '${{ github.workflow }}-${{ github.ref }}'
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - uses: ./.github/actions/setup-node-project

            - name: Build project
              run: npm run build

    format-check:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.pull_request.head.sha }}

            - uses: ./.github/actions/setup-node-project

            - name: Check code format
              env:
                  FORMAT_BASE: ${{ github.event.pull_request.base.sha }}
                  FORMAT_HEAD: ${{ github.event.pull_request.head.sha }}
              run: npm run format:check

    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.pull_request.head.sha }}

            - uses: ./.github/actions/setup-node-project

            - name: Run linter
              env:
                  LINT_BASE: ${{ github.event.pull_request.base.sha }}
                  LINT_HEAD: ${{ github.event.pull_request.head.sha }}
              run: npm run lint

    type-check:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - uses: ./.github/actions/setup-node-project

            - name: Restore type-check cache
              uses: actions/cache@v4
              with:
                  path: node_modules/.cache/type-check.tsbuildinfo
                  key: type-check-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json', '.nvmrc') }}-${{ github.sha }}
                  restore-keys: |
                      type-check-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json', '.nvmrc') }}-

            - name: Check types
              run: npm run type-check

    test:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - uses: ./.github/actions/setup-node-project

            - name: Run unit tests
              run: npm run test:coverage

    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.pull_request.head.sha }}

            - uses: ./.github/actions/setup-node-project

            - name: Run end-to-end tests
              env:
                  TEST_E2E_CHANGED: 'true'
                  TEST_BASE: ${{ github.event.pull_request.base.sha }}
              run: npm run test:e2e -- --changed "$TEST_BASE" --passWithNoTests
